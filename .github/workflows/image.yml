name: Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "openspec/**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build, verify and publish image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image without publishing
        uses: docker/build-push-action@v7
        with:
          push: false
          load: true
          tags: valet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        run: |
          set -euo pipefail

          # Read the expected version straight from Cargo.toml (never hardcoded).
          expected_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "${expected_version}" ]; then
            echo "::error::Could not read the version from Cargo.toml"
            exit 1
          fi
          echo "Expected version (from Cargo.toml): ${expected_version}"

          # DATABASE_URL points at /tmp on purpose: create_if_missing(true) creates
          # the database file but not its parent directory, and /tmp always exists
          # and is writable. AUTH_ENABLED is omitted because its default is false.
          docker run -d --name valet-ci -p 3000:3000 -e DATABASE_URL=/tmp/valet.db valet:ci

          max_attempts=30
          body=""

          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Health check attempt ${attempt}/${max_attempts}"
            http_code="$(curl -s -o /tmp/valet-health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)"
            body="$(cat /tmp/valet-health.json 2>/dev/null || true)"
            echo "HTTP ${http_code} - ${body}"
            if [ "${http_code}" = "200" ] \
              && printf '%s' "${body}" | jq -e --arg v "${expected_version}" \
                   '.status == "ok" and .db == "connected" and .version == $v' > /dev/null 2>&1; then
              echo "Initial health check passed; verifying the container survives past the drain budget..."

              # The drain budget is 5s (SHUTDOWN_DRAIN_TIMEOUT in src/main.rs), so a
              # 10s wait gives a comfortable margin: a server whose drain clock
              # wrongly runs during normal service dies well before this sleep ends.
              sleep 10

              # Two independent checks after the wait: the container must still be
              # running, and the endpoint must still answer with the same contract.
              running="$(docker inspect -f '{{.State.Running}}' valet-ci 2>/dev/null || true)"
              http_code="$(curl -s -o /tmp/valet-health.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true)"
              body="$(cat /tmp/valet-health.json 2>/dev/null || true)"
              echo "Survival check: running=${running} HTTP ${http_code} - ${body}"

              if [ "${running}" = "true" ] \
                && [ "${http_code}" = "200" ] \
                && printf '%s' "${body}" | jq -e --arg v "${expected_version}" \
                     '.status == "ok" and .db == "connected" and .version == $v' > /dev/null 2>&1; then
                echo "Smoke test passed: container survived past the drain budget, status ok, db connected, version ${expected_version}"
                exit 0
              fi

              echo "::error::The container self-terminated after startup: it did not survive the shutdown drain budget (the drain clock must not run while the server is serving normally)"
              docker logs valet-ci || true
              exit 1
            fi
            sleep 2
          done

          echo "::error::Smoke test failed after ${max_attempts} attempts"
          docker logs valet-ci || true
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish the verified image
        env:
          IMAGE: ghcr.io/atareao/valet-ai
        run: |
          set -euo pipefail

          short_sha="$(printf '%s' "${GITHUB_SHA}" | cut -c1-7)"
          tags=()

          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch)
              # A manual run may be triggered on any branch: publish only the
              # immutable sha tag and never move `latest`.
              tags=("sha-${short_sha}")
              ;;
            push)
              if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                # Release tag vX.Y.Z -> vX.Y.Z, X.Y and latest.
                version="${GITHUB_REF_NAME}"
                if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                  echo "::error::Unexpected release tag format: ${version}"
                  exit 1
                fi
                minor="${version%.*}"
                tags=("${version}" "${minor#v}" "latest")
              else
                # Push to main -> latest and the short-sha tag.
                tags=("latest" "sha-${short_sha}")
              fi
              ;;
            *)
              echo "::error::Unsupported event: ${GITHUB_EVENT_NAME}"
              exit 1
              ;;
          esac

          for tag in "${tags[@]}"; do
            docker tag valet:ci "${IMAGE}:${tag}"
          done

          for tag in "${tags[@]}"; do
            docker push "${IMAGE}:${tag}"
          done
